name: CI
on:
  push:
    branches: ["main", "dev/**"]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Unit and differential tests
        run: ctest --test-dir build --output-on-failure
      - name: Compile and compare AArch64 assembly and C guests
        if: runner.os == 'Linux'
        run: bash tests/check_guests.sh build
